id = "smart_digging"
name = "Smart Digging"
version = "0.2.0"
authors = ["Natsu975T"]
description = "Two-point excavation selection controlled with F6 and right mouse click."
license = "MIT"
loader = ">=0.2.0 <1.0.0"
game = ["2.0.1"]
affects = "gameplay"

[[settings]]
key = "toggle_key"
type = "key"
default = "F6"
label = "Attiva/disattiva Smart Digging"

[[settings]]
key = "depth"
type = "number"
min = 1
max = 256
step = 1
default = 5
label = "Profondita' di scavo"
